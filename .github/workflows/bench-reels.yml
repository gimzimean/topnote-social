name: bench-reels
# 하루 두 번 12:40·20:40 KST에 인터뷰 릴스 대기열 다음 편을 올린다(scripts/bench-queue.mjs).
# 깃허브 예약은 몇 시간씩 밀려서 쓰지 않는다 → Supabase pg_cron(bench-reels-noon·evening)이 workflow_dispatch로 깨운다(2026-11-08).
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency: post
jobs:
  reel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 올리기
        env:
          TOKEN_KEY: ${{ secrets.TOKEN_KEY }}
        run: node scripts/bench-queue.mjs
      - name: 올린 기록·새 토큰 저장
        if: always()
        run: |
          git config user.name "topnote-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state.json tokens.enc 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "인터뷰 릴스 올린 기록" && git pull --rebase && git push)
