name: ads
# 광고 영상 12편을 하루 두 번(12:30 · 20:00 KST) 한 편씩 릴스·스토리·스레드·틱톡(나만 보기 · 글 포함)에 올린다(scripts/ad-queue.mjs).
# 정각은 깃허브가 자주 건너뛰어 시간마다 재시도를 둔다. 같은 시간 칸에는 한 번만 올린다.
on:
  schedule:
    - cron: '30 3 * * *'   # 12:30 KST
    - cron: '52 3 * * *'   # 12:52 KST 재시도
    - cron: '0 11 * * *'   # 20:00 KST
    - cron: '23 11 * * *'  # 20:23 KST 재시도
    - cron: '48 11 * * *'  # 20:48 KST 재시도
  workflow_dispatch:
    inputs:
      ad:
        description: '바로 올릴 편(예: ad01, 비우면 대기열 다음 편)'
        required: false
permissions:
  contents: write
concurrency: post
jobs:
  ad:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 올리기
        env:
          TOKEN_KEY: ${{ secrets.TOKEN_KEY }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_MODE: ${{ vars.TIKTOK_MODE }}
          AD: ${{ inputs.ad }}
        run: node scripts/ad-queue.mjs
      - name: 올린 기록·새 토큰 저장
        if: always()
        run: |
          git config user.name "topnote-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state.json tokens.enc docs/tiktok 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "광고 영상 올린 기록" && git pull --rebase && git push)
