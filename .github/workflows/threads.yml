name: threads
# 스레드 글을 하루 2칸(12:40 · 20:40 KST) 올린다.
# 자연스러운 경험담 원글 뒤에 주소 없이 프로필 링크만 짧게 안내한다.
# GitHub 예약은 자주 밀리거나 빠져서 칸마다 3번 걸어 두고, 3시간 안에 올린 게 있으면 스크립트가 건너뛴다.
on:
  schedule:
    - cron: '40 3 * * *'
    - cron: '55 3 * * *'
    - cron: '15 4 * * *'
    - cron: '40 11 * * *'
    - cron: '55 11 * * *'
    - cron: '15 12 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency: post
jobs:
  text:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 올리기
        env:
          TOKEN_KEY: ${{ secrets.TOKEN_KEY }}
        run: node scripts/threads-text.mjs
      - name: 올린 기록·새 토큰 저장
        if: always()
        run: |
          git config user.name "topnote-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state.json tokens.enc 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "스레드 글 올린 기록" && for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done)
