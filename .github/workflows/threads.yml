name: threads
# 스레드 글을 하루 4칸(08:30 · 12:40 · 18:30 · 23:10 KST) 올린다. ZZEND 방식: 사람 표지 원글 → 답글 3개(2~8분 간격), 링크는 마지막 답글(2026-11-07 대표 「적당한 간격으로」).
# GitHub 예약은 자주 밀리거나 빠져서 칸마다 3번 걸어 두고, 3시간 안에 올린 게 있으면 스크립트가 건너뛴다.
on:
  schedule:
    - cron: '30 23 * * *'
    - cron: '45 23 * * *'
    - cron: '5 0 * * *'
    - cron: '40 3 * * *'
    - cron: '55 3 * * *'
    - cron: '15 4 * * *'
    - cron: '30 9 * * *'
    - cron: '45 9 * * *'
    - cron: '5 10 * * *'
    - cron: '10 14 * * *'
    - cron: '25 14 * * *'
    - cron: '45 14 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency: post
jobs:
  text:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 올리기
        env:
          TOKEN_KEY: ${{ secrets.TOKEN_KEY }}
        run: node scripts/threads-text.mjs
      - name: 올린 기록·새 토큰 저장
        if: always()
        run: |
          git config user.name "topnote-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state.json tokens.enc 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "스레드 글 올린 기록" && for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done)
