name: reels
# 매일 12:37 KST(03:37 UTC)에 대기열의 다음 숏폼 한 편을 릴스·스토리·스레드·틱톡(나만 보기 · 글 포함)에 올린다(scripts/reel-queue.mjs).
on:
  schedule:
    - cron: '37 3 * * *'
    - cron: '17 4 * * *'
  workflow_dispatch:
    inputs:
      ep:
        description: '바로 올릴 편(예: ep7, 비우면 대기열 다음 편)'
        required: false
permissions:
  contents: write
concurrency: post
jobs:
  reel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 올리기
        env:
          TOKEN_KEY: ${{ secrets.TOKEN_KEY }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_MODE: ${{ vars.TIKTOK_MODE }}
          EP: ${{ inputs.ep }}
        run: node scripts/reel-queue.mjs
      - name: 올린 기록·새 토큰 저장
        if: always()
        run: |
          git config user.name "topnote-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state.json tokens.enc docs/tiktok 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "숏폼 올린 기록" && git push)
