name: report
# 매일 07:30 KST(전날 22:30 UTC) 어제 실적을 reports/<날짜>.json 에 모은다. 08:00 KST 클로드 루틴이 읽어 보고한다.
on:
  schedule:
    - cron: '30 22 * * *'
    - cron: '45 22 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency: post
jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 모으기
        env:
          TOKEN_KEY: ${{ secrets.TOKEN_KEY }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          META_ADS_TOKEN: ${{ secrets.META_ADS_TOKEN }}
        run: node scripts/report.mjs
      - name: 저장
        run: |
          git config user.name "topnote-bot"
          git config user.email "actions@users.noreply.github.com"
          git add reports tokens.enc 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "아침 보고 숫자" && git pull --rebase -q && git push)
